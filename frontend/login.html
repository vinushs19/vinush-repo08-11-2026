<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In & Register — AI-Based College Resource Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YcnS/NPWKapLI5e0A5eLmVkLf0jm0RMEZ9z"
          crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }
        .auth-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 460px;
            padding: 2.5rem;
        }
        .nav-pills .nav-link {
            font-weight: 600;
            color: #64748b;
        }
        .nav-pills .nav-link.active {
            background-color: #2563eb;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="text-center mb-4">
                <div style="font-size: 2.8rem;">🎓</div>
                <h4 class="fw-bold mt-2 mb-1">College Resource Finder</h4>
                <p class="text-muted small">Sign in or create your student account</p>
            </div>

            <ul class="nav nav-pills nav-fill mb-3" id="authTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#tab-login" type="button" role="tab">Sign In</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#tab-register" type="button" role="tab">Register</button>
                </li>
            </ul>

            <div id="alertBox" class="alert d-none py-2 small" role="alert"></div>

            <div class="tab-content" id="authTabsContent">
                <!-- Login Tab -->
                <div class="tab-pane fade show active" id="tab-login" role="tabpanel">
                    <form id="loginForm" novalidate>
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label small fw-semibold">Email address</label>
                            <input type="email" class="form-control" id="loginEmail" placeholder="student@college.edu" required autocomplete="email">
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label small fw-semibold">Password</label>
                            <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg" id="btnLogin">Sign In</button>
                        </div>
                    </form>
                </div>

                <!-- Registration Tab (Role is strictly locked to Student) -->
                <div class="tab-pane fade" id="tab-register" role="tabpanel">
                    <form id="registerForm" novalidate>
                        <div class="mb-3">
                            <label for="regName" class="form-label small fw-semibold">Full Name</label>
                            <input type="text" class="form-control" id="regName" placeholder="e.g. Vinush S" required>
                        </div>
                        <div class="mb-3">
                            <label for="regEmail" class="form-label small fw-semibold">Email address</label>
                            <input type="email" class="form-control" id="regEmail" placeholder="yourname@college.edu" required autocomplete="email">
                        </div>
                        <div class="mb-3">
                            <label for="regPassword" class="form-label small fw-semibold">Password (min 8 characters)</label>
                            <input type="password" class="form-control" id="regPassword" placeholder="••••••••" minlength="8" required autocomplete="new-password">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Account Role</label>
                            <input type="text" class="form-control bg-light" value="Student (Default)" readonly disabled>
                            <div class="form-text small">Public registration is assigned the Student role. Faculty and Admin roles are granted by administrators.</div>
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-success btn-lg" id="btnRegister">Create Account</button>
                        </div>
                    </form>
                </div>
            </div>

            <hr class="my-4">
            <div class="text-center">
                <a href="/" class="text-decoration-none small">← Back to Home</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    <script>
        function showAlert(type, message) {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `alert alert-${type} py-2 small`;
            alertBox.textContent = message;
            alertBox.classList.remove('d-none');
        }

        // Handle Login
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('btnLogin');

            if (!email || !password) {
                showAlert('danger', 'Please enter both email and password.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                const res = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                    credentials: 'include'
                });
                const json = await res.json();
                if (res.ok && json.success) {
                    showAlert('success', 'Login successful! Redirecting...');
                    setTimeout(() => window.location.href = '/', 1000);
                } else {
                    showAlert('danger', json.message || json.error || 'Invalid credentials. Please try again.');
                }
            } catch (err) {
                showAlert('danger', 'Network error. Please ensure backend is running.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });

        // Handle Registration
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const btn = document.getElementById('btnRegister');

            if (!name || !email || !password) {
                showAlert('danger', 'All registration fields are required.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Creating account...';

            try {
                const res = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password }),
                    credentials: 'include'
                });
                const json = await res.json();
                if (res.ok && json.success) {
                    showAlert('success', 'Registration successful! You may now sign in.');
                    document.getElementById('login-tab').click();
                    document.getElementById('loginEmail').value = email;
                } else {
                    showAlert('danger', json.message || json.error || 'Registration failed.');
                }
            } catch (err) {
                showAlert('danger', 'Network error. Please try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        });
    </script>
</body>
</html>
